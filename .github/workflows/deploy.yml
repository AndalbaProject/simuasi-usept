# Auto deploy ke GitHub Pages setiap kali ada push ke branch main
name: Deploy USEPT ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Pages
        uses: actions/configure-pages@v5
      - name: Upload artefak (seluruh isi repo sebagai situs statis)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
